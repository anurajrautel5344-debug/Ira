<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        const isViteHmr = (s) => typeof s === 'string' && (s.includes('[vite]') || s.includes('websocket') || s.includes('WebSocket'));
        const wrap = (fn) => function(...args) {
          if (args.some(isViteHmr)) return;
          fn.apply(console, args);
        };
        console.warn = wrap(console.warn);
        console.error = wrap(console.error);
        console.log = wrap(console.log);
        console.debug = wrap(console.debug);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ira" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
